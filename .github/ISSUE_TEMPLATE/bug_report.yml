name: Bug report
description: Report a reproducible defect in Praxis or Praxis Flow.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, access tokens, private URLs, and customer data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Praxis Flow version or commit
      placeholder: v1.4.0 or a commit SHA
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options: [CLI, Standard generator, Praxis Pro, Template gallery, Generated project, Website, Documentation]
