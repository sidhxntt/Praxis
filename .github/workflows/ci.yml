name: CI

on:
  push:
    branches: [cli]
  pull_request:
    branches: [cli]

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/ui/gallery.test.ts tests/ui/resolveUi.test.ts tests/workflow/runCreate.test.ts

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:verify
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
