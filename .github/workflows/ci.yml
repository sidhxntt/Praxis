name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - run: npm --workspace cli exec -- vitest run tests/ui/gallery.test.ts tests/ui/resolveUi.test.ts tests/workflow/runCreate.test.ts

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace cli exec -- playwright install --with-deps chromium
      - run: npm --workspace cli run ui:verify
      - run: npm run test:cli
      - run: npm run build:cli
      - run: npm audit --workspace cli --omit=dev --audit-level=critical

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
