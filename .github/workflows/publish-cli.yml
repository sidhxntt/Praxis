name: Publish Praxis Flow CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@sidhxntt"
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        working-directory: cli
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "cli-v${package_version}" = "$GITHUB_REF_NAME"
      - name: Verify CLI
        run: npm --workspace cli run check
      - name: Publish package
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts
      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" --title "Praxis Flow CLI $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
