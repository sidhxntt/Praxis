name: Publish Praxis release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release tag matches repository version
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "Praxis $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
