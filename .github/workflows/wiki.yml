name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check-doc-links.mjs"
      - "scripts/render-github-wiki.mjs"
      - "package.json"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: praxis-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - name: Clone Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
      - name: Render managed Wiki pages
        run: npm run docs:wiki -- wiki
      - name: Publish Wiki changes
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home.md Overview.md Architecture.md Terminology.md Repository-Map.md Code-Architecture.md Generation-Pipeline.md Manifest-System.md Standard-Projects.md Praxis-Pro.md Generated-Backends.md UI-Templates.md Testing.md Agent-Guide.md Wiki-Publishing.md _Sidebar.md _Footer.md
          if git diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi
          git commit -m "docs: publish Praxis Wiki"
          git push
