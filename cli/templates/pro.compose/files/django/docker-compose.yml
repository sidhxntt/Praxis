name: {{projectName}}
services:
  api:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: local-development-only-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_HOST: postgres
      DATABASE_NAME: app
      DATABASE_USER: app
      DATABASE_PASSWORD: app
      DATABASE_PORT: "5432"
      # @praxis:api-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # @praxis:api-dependencies
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.asgi:application --worker-class uvicorn_worker.UvicornWorker --bind 0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  # @praxis:services
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
