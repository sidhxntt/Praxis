apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{projectName}}, app.kubernetes.io/component: scheduler }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{projectName}}, app.kubernetes.io/component: scheduler }
    spec:
      serviceAccountName: {{projectName}}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: scheduler
          image: praxis-api
          command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
          envFrom: [{ configMapRef: { name: app-config } }]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: praxis-secrets, key: django-secret-key } }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: praxis-secrets, key: database-password } }
            - name: REDIS_URL
              value: redis://redis:6379/0
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
