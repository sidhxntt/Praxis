apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      server_tokens off;
      upstream api_upstream { server api:80; }
      server {
        listen 8080;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location / {
          proxy_pass http://api_upstream;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector: { app.kubernetes.io/name: nginx }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: nginx }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nginx, app.kubernetes.io/part-of: {{projectName}} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nginx
          image: nginx:1.30.3-alpine
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /nginx-health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /nginx-health, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: config, configMap: { name: nginx-config } }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
