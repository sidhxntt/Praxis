apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http: { method: GET, valid_status_codes: [200], preferred_ip_protocol: ip4 }
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
spec:
  selector: { app.kubernetes.io/name: blackbox-exporter }
  ports: [{ name: http, port: 9115 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: blackbox-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: blackbox-exporter, app.kubernetes.io/part-of: {{projectName}} }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.28.0
          args: ["--config.file=/etc/blackbox/config.yml"]
          ports: [{ name: http, containerPort: 9115 }]
          readinessProbe: { httpGet: { path: /-/healthy, port: http } }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: config, mountPath: /etc/blackbox, readOnly: true }]
      volumes: [{ name: config, configMap: { name: blackbox-config } }]
