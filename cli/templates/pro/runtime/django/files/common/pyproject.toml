[project]
name = "{{projectName}}"
version = "0.1.0"
description = "Production backend generated by Praxis Pro"
requires-python = ">=3.12,<3.15"
dependencies = [
  "django==6.0.7",
  "djangorestframework==3.17.1",
  "psycopg[binary,pool]==3.3.4",
  "drf-spectacular==0.30.0",
  "django-cors-headers==4.9.0",
  "django-filter==25.2",
  "gunicorn==26.0.0",
  "uvicorn==0.52.0",
  "uvicorn-worker==0.4.0",
  # @praxis:dependencies
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-django==4.11.1",
  "factory-boy==3.3.3",
  "testcontainers[postgres]==4.10.0",
  "ruff==0.12.4",
  "mypy==1.17.0",
  "django-stubs[compatible-mypy]==6.0.7",
  "djangorestframework-stubs==3.17.0",
  "bandit==1.9.4",
  "pip-audit==2.9.0",
  # @praxis:dev-dependencies
]

[tool.pdm]
distribution = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["channels.*", "confluent_kafka", "locust"]
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["core.consumers"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["ops.load.locustfile"]
disallow_untyped_calls = false
