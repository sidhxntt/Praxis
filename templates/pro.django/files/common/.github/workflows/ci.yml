name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"
      - run: pdm install
      - run: pdm run ruff check .
      - run: pdm run mypy .
      - run: pdm run bandit -r config core
      - run: pdm run pip-audit
      - run: pdm run pytest
      - run: pdm run python manage.py makemigrations --check --dry-run
      - run: DJANGO_SETTINGS_MODULE=config.settings.production DJANGO_SECRET_KEY=ci-only-secret-key-ci-only-secret-key-ci-only-secret-key ALLOWED_HOSTS=example.com pdm run python manage.py check --deploy
      - run: docker build -t {{projectName}}:ci .
