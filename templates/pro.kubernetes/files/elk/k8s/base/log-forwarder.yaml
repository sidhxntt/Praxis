apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 5
        Log_Level info
        Parsers_File parsers.conf
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Parser cri
        Tag kube.*
        Mem_Buf_Limit 20MB
        Skip_Long_Lines On
    [OUTPUT]
        Name es
        Match kube.*
        Host ${ELASTIC_LOG_HOST}
        Port ${ELASTIC_LOG_PORT}
        HTTP_User ${ELASTIC_LOG_USERNAME}
        HTTP_Passwd ${ELASTIC_LOG_PASSWORD}
        Logstash_Format On
        Logstash_Prefix praxis
        tls On
        tls.verify On
  parsers.conf: |
    [PARSER]
        Name cri
        Format regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-forwarder
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: {{projectName}}, app.kubernetes.io/component: log-forwarder }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{projectName}}, app.kubernetes.io/component: log-forwarder }
    spec:
      serviceAccountName: {{projectName}}
      automountServiceAccountToken: false
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.2.2
          env:
            - name: ELASTIC_LOG_HOST
              valueFrom: { secretKeyRef: { name: praxis-secrets, key: elastic-log-host } }
            - name: ELASTIC_LOG_PORT
              valueFrom: { secretKeyRef: { name: praxis-secrets, key: elastic-log-port } }
            - name: ELASTIC_LOG_USERNAME
              valueFrom: { secretKeyRef: { name: praxis-secrets, key: elastic-log-username } }
            - name: ELASTIC_LOG_PASSWORD
              valueFrom: { secretKeyRef: { name: praxis-secrets, key: elastic-log-password } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts:
            - { name: logs, mountPath: /var/log, readOnly: true }
            - { name: config, mountPath: /fluent-bit/etc, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: logs, hostPath: { path: /var/log, type: Directory } }
        - { name: config, configMap: { name: fluent-bit-config } }
        - { name: tmp, emptyDir: {} }
