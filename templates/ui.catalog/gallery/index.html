<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a Praxis Flow landing page</title>
    <link rel="stylesheet" href="/gallery.css" />
    <script src="/gallery.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <div><span class="eyebrow">Praxis Flow</span><h1>Choose your landing-page direction</h1></div>
      <p>Forty original, framework-native starting points. Search, preview, then send your choice back to the CLI.</p>
    </header>
    <main>
      <section class="toolbar" aria-label="Gallery filters">
        <label><span>Search styles</span><input id="search" type="search" placeholder="Minimal, editorial, developer…" autocomplete="off" /></label>
        <div id="traits" class="traits" aria-label="Filter by trait"></div>
        <p id="count" aria-live="polite"></p>
      </section>
      <section id="gallery" class="gallery" aria-label="Landing-page styles"></section>
    </main>
    <dialog id="preview">
      <button class="close" type="button" aria-label="Close preview">×</button>
      <div class="preview-art" id="preview-art"></div>
      <div class="preview-copy"><span class="eyebrow" id="preview-theme"></span><h2 id="preview-title"></h2><p id="preview-description"></p><div id="preview-traits" class="traits"></div><button id="select" class="select" type="button">Use this style</button><p id="status" role="status"></p></div>
    </dialog>
    <noscript>This gallery requires JavaScript. Return to the terminal to choose from the fallback list.</noscript>
  </body>
</html>
